  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.2s, color 0.2s; overflow-x: hidden; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
  }

  .gradient-text {
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--btn-ghost-color); border: 1px solid var(--btn-ghost-border); }
  .btn-ghost:hover { background: var(--btn-ghost-hover); color: var(--btn-ghost-hover-color); }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }

  input[type=number] {

    padding: 6px 8px;
    background: var(--input-bg);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    color: var(--input-text);
    font-size: 16px;
    font-weight: 700;
    text-align: center;
  }
  input[type=number]:focus { outline: none; border-color: #3b82f6; }

  .nav-tab {
    padding: 10px 20px;
    border: none;
    background: transparent;
    color: var(--nav-tab-color);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;

  .nav-tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }

const { useState, useEffect, useMemo, useCallback } = React;

function useIsMobile() {
  const [mobile, setMobile] = useState(() => window.innerWidth < 600);
  useEffect(() => {
    const fn = () => setMobile(window.innerWidth < 600);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return mobile;
}

const ThemeCtx = React.createContext({ isDark: true });

function useTheme() {
  const [mode, setMode] = useState(() => localStorage.getItem('themeMode') || 'system');
  const [sysDark, setSysDark] = useState(() => window.matchMedia('(prefers-color-scheme: dark)').matches);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const fn = e => setSysDark(e.matches);
    // Safari <14 only supports the legacy addListener/removeListener API
    if (mq.addEventListener) {
      mq.addEventListener('change', fn);
      return () => mq.removeEventListener('change', fn);
    } else if (mq.addListener) {
      mq.addListener(fn);
      return () => mq.removeListener(fn);
    }
  }, []);
  const isDark = mode === 'dark' || (mode === 'system' && sysDark);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    localStorage.setItem('themeMode', mode);
  }, [isDark, mode]);
  return { mode, setMode, isDark };
}

function useC() {
  const { isDark } = React.useContext(ThemeCtx);
  const w = a => isDark ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
  return {
    w,
    text: isDark ? '#e2e8f0' : '#1e293b',
    inputText: isDark ? 'white' : '#1e293b',
    optionBg: isDark ? '#1e293b' : '#f8fafc',
  };
}

// ===== SCORING ENGINE =====
function calcPoints(tipHome, tipAway, actHome, actAway) {
  if (tipHome === null || tipHome === undefined || actHome === null || actHome === undefined) return 0;
  if (tipHome === actHome && tipAway === actAway) return 3;
  const tipDir = tipHome > tipAway ? 1 : tipHome < tipAway ? -1 : 0;
  const actDir = actHome > actAway ? 1 : actHome < actAway ? -1 : 0;
  if (tipDir === actDir) return 1;
  return 0;
}

function getStandings(results, meta) {
  return PARTICIPANTS.map(name => {
    const tips = PREDICTIONS[name] || {};
    const m = META[name] || {};
    let matchPoints = 0;
    let exact = 0;
    let direction = 0;
    let matchDetail = {};

    Object.entries(results).forEach(([numStr, res]) => {
      const num = parseInt(numStr);
      const tip = tips[numStr] || tips[num];
      if (!tip || res.home_score === null || res.home_score === undefined) return;
      const pts = calcPoints(tip.home, tip.away, res.home_score, res.away_score);
      matchPoints += pts;
      if (pts === 3) exact++;
      if (pts === 1) direction++;
      matchDetail[num] = pts;
    });

    const vmPoints = (meta.vm_winner && m.vinner_vm === meta.vm_winner) ? 5 : 0;
    const tsPoints = (meta.toppscorer && m.toppscorer === meta.toppscorer) ? 6 : 0;
    const total = matchPoints + vmPoints + tsPoints;

    return { name, total, matchPoints, vmPoints, tsPoints, exact, direction, matchDetail };
  }).sort((a,b) => b.total - a.total || b.exact - a.exact || b.direction - a.direction);
}

          {standings.map((st,i) => {

            return <option key={st.name} value={st.name} style={{background:C.optionBg,color:C.text}}>{medal}#{i+1} {st.name} – {st.total} poeng</option>;

        <div className="stat-card" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Plass</div>
          <div style={{fontSize:40,fontWeight:900,color:rank<=3?['#fbbf24','#94a3b8','#cd7c2f'][rank-1]:C.text}}>
            {rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : `#${rank}`}
          </div>
        </div>
        <div className="stat-card" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Totalt</div>
          <div style={{fontSize:36,fontWeight:900,color:'#60a5fa'}}>{s.total||0}</div>
        </div>
        <div className="stat-card" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Riktig score</div>
          <div style={{fontSize:36,fontWeight:900,color:'#4ade80'}}>{s.exact||0}</div>
        </div>
        <div className="stat-card" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Riktig retning</div>
          <div style={{fontSize:36,fontWeight:900,color:'#facc15'}}>{s.direction||0}</div>

        <div className="stat-card" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>VM-vinner</div>
          <div style={{fontSize:14,fontWeight:700,marginTop:4,color:vmCorrect?'#4ade80':C.text}}>{m.vinner_vm||'–'}</div>
          <div style={{fontSize:11,color:vmCorrect?'#4ade80':'#64748b',marginTop:2}}>
            {vmCorrect?`✓ +5 poeng`:`(5 poeng)`}
          </div>
        </div>
        <div className="stat-card" style={{textAlign:'center'}}>
          <div style={{fontSize:11,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Toppscorer</div>
          <div style={{fontSize:14,fontWeight:700,marginTop:4,color:tsCorrect?'#4ade80':C.text}}>{m.toppscorer||'–'}</div>
          <div style={{fontSize:11,color:tsCorrect?'#4ade80':'#64748b',marginTop:2}}>
            {tsCorrect?`✓ +6 poeng`:`(6 poeng)`}

      <div className="glass" style={{overflow:'hidden'}}>
        <table>
          <thead>
            <tr>
              <th style={{width:30}}>#</th>
              {!isMobile && <th>Hjemmelag</th>}
              <th style={{textAlign:'center'}}>Resultat</th>
              <th style={{textAlign:'center'}}>Tippet</th>
              {!isMobile && <th>Bortelag</th>}
              <th style={{textAlign:'center'}}>P</th>

              <tr key={m.num}>

                <td style={{textAlign:'center'}}>
                  {m.tip ? (
                    <ScoreBadge home={m.tip.home} away={m.tip.away} pts={m.pts!==null?m.pts:0}/>

                {!isMobile && <td style={{fontSize:13}}><Flag country={m.away}/> {m.away}</td>}
                <td style={{textAlign:'center'}}>

                    <span style={{fontWeight:800,fontSize:14,
                      color:m.pts===3?'#4ade80':m.pts===1?'#facc15':'#475569'}}>

            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ===== STATISTIKK VIEW =====
function StatistikkView({ results, meta }) {
  const standings = useMemo(() => getStandings(results, meta), [results, meta]);
  const playedMatches = MATCHES_RAW.filter(m => {
    const r = results[m.num];
    return r && r.home_score !== null && r.home_score !== undefined;
  });

  if (playedMatches.length === 0) {
    return (
      <div className="fade-in" style={{textAlign:'center',padding:60}}>
        <div style={{fontSize:48,marginBottom:16}}>⚽</div>
        <div style={{color:'#64748b',fontSize:18}}>Ingen kamper spilt ennå</div>
        <div style={{color:'#475569',fontSize:14,marginTop:8}}>Legg inn kampresultater for å se statistikk</div>
      </div>
    );
  }

  // Per-match: how many got it exactly right
  const matchStats = playedMatches.map(m => {
    const res = results[m.num];
    let exact = 0, dir = 0, wrong = 0;
    PARTICIPANTS.forEach(p => {
      const tip = PREDICTIONS[p]?.[String(m.num)] || PREDICTIONS[p]?.[m.num];
      if (!tip) return;
      const pts = calcPoints(tip.home, tip.away, res.home_score, res.away_score);
      if (pts === 3) exact++;
      else if (pts === 1) dir++;
      else wrong++;
    });
    return { ...m, exact, dir, wrong, total: exact+dir+wrong };
  }).sort((a,b) => b.exact - a.exact);

  // Best and worst predicted matches
  const bestMatch = matchStats[0];
  const worstMatch = [...matchStats].sort((a,b) => a.exact - b.exact)[0];

  // VM winner distribution
  const vmDist = {};
  PARTICIPANTS.forEach(p => { const vm = META[p]?.vinner_vm; if(vm) vmDist[vm] = (vmDist[vm]||0)+1; });
  const vmSorted = Object.entries(vmDist).sort((a,b)=>b[1]-a[1]);

  // Toppscorer distribution
  const tsDist = {};
  PARTICIPANTS.forEach(p => { const ts = META[p]?.toppscorer; if(ts) tsDist[ts] = (tsDist[ts]||0)+1; });
  const tsSorted = Object.entries(tsDist).sort((a,b)=>b[1]-a[1]);

  return (
    <div className="fade-in" style={{display:'grid',gap:20}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(300px,100%),1fr))',gap:16}}>

        <div className="stat-card">
          <div style={{fontWeight:700,fontSize:15,marginBottom:16,color:'#a78bfa'}}>🏆 VM-vinner tipps</div>
          {vmSorted.map(([team, count]) => (
            <div key={team} style={{marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:13,fontWeight:600}}>
                  <Flag country={team}/> {team}
                  {meta.vm_winner === team ? <span style={{color:'#4ade80',marginLeft:6}}>✓ Riktig!</span> : ''}
                </span>
                <span style={{fontSize:13,color:'#94a3b8'}}>{count} deltakere</span>
              </div>
              <div className="progress-bar">
                <div className="progress-fill" style={{
                  width:`${(count/PARTICIPANTS.length)*100}%`,
                  background: meta.vm_winner === team ? '#4ade80' : '#a78bfa'
                }}/>
              </div>
            </div>
          ))}
        </div>

        <div className="stat-card">
          <div style={{fontWeight:700,fontSize:15,marginBottom:16,color:'#f472b6'}}>⚽ Toppscorer tipps</div>
          {tsSorted.map(([player, count]) => (
            <div key={player} style={{marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:13,fontWeight:600}}>
                  {player}
                  {meta.toppscorer === player ? <span style={{color:'#4ade80',marginLeft:6}}>✓ Riktig!</span> : ''}
                </span>
                <span style={{fontSize:13,color:'#94a3b8'}}>{count}</span>
              </div>
              <div className="progress-bar">
                <div className="progress-fill" style={{
                  width:`${(count/PARTICIPANTS.length)*100}%`,
                  background: meta.toppscorer === player ? '#4ade80' : '#f472b6'
                }}/>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="stat-card" style={{minWidth:0}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:16,color:'#60a5fa'}}>📊 Mest tippede kamper riktig</div>
        <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Kamp</th>
              <th style={{textAlign:'center'}}>Resultat</th>
              <th style={{textAlign:'center'}}>Riktig score</th>
              <th style={{textAlign:'center'}}>Riktig retning</th>
              <th style={{textAlign:'center'}}>Feil</th>
            </tr>
          </thead>
          <tbody>
            {matchStats.slice(0,15).map(m => {
              const res = results[m.num];
              return (
                <tr key={m.num}>
                  <td style={{color:'#475569'}}>{m.num}</td>
                  <td style={{fontSize:13}}><Flag country={m.home}/> {m.home} – {m.away} <Flag country={m.away}/></td>
                  <td style={{textAlign:'center',fontWeight:700}}>{res.home_score}–{res.away_score}</td>
                  <td style={{textAlign:'center'}}>
                    <span style={{color:'#4ade80',fontWeight:700}}>{m.exact}</span>
                    <span style={{color:'#475569',fontSize:11}}> /{m.total}</span>
                  </td>
                  <td style={{textAlign:'center',color:'#facc15',fontWeight:600}}>{m.dir}</td>
                  <td style={{textAlign:'center',color:'#f87171'}}>{m.wrong}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

// ===== ADMIN / BONUS VIEW =====
function AdminView({ meta, setMeta }) {
  const C = useC();
  const [vm, setVm] = useState(meta.vm_winner || '');
  const [ts, setTs] = useState(meta.toppscorer || '');
  const [saved, setSaved] = useState(false);

  const save = () => {
    const newMeta = { ...meta, vm_winner: vm || null, toppscorer: ts || null };
    setMeta(newMeta);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  // All VM winner tipps for reference
  const vmTipps = [...new Set(Object.values(META).map(m=>m.vinner_vm).filter(Boolean))];
  const tsTipps = [...new Set(Object.values(META).map(m=>m.toppscorer).filter(Boolean))];

  return (
    <div className="fade-in">
      <div className="glass" style={{padding:24,maxWidth:600,marginBottom:20}}>
        <h2 style={{fontSize:18,fontWeight:700,marginBottom:4}}>Bonus: VM-vinner & Toppscorer</h2>
        <p style={{color:'#64748b',fontSize:13,marginBottom:20}}>Sett vinneren av VM og toppscoreren for å gi bonuspoeng (5 og 6 poeng)</p>

        <div style={{marginBottom:16}}>
          <label style={{fontSize:13,color:'#94a3b8',display:'block',marginBottom:6}}>VM-vinner (5 poeng)</label>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
            {vmTipps.map(t => (
              <button key={t} onClick={()=>setVm(t)} className="btn" style={{
                fontSize:12, padding:'4px 12px',
                background: vm===t?'rgba(74,222,128,0.2)':C.w(0.06),
                border: vm===t?'1px solid #4ade80':`1px solid ${C.w(0.1)}`,
                color: vm===t?'#4ade80':'#94a3b8'
              }}>
                <Flag country={t}/> {t}
              </button>
            ))}
          </div>
          <input
            value={vm}
            onChange={e=>setVm(e.target.value)}
            placeholder="Eller skriv inn nasjon..."
            style={{
              width:'100%',padding:'8px 12px',background:C.w(0.06),
              border:`1px solid ${C.w(0.15)}`,borderRadius:8,color:C.inputText,fontSize:14
            }}
          />
        </div>

        <div style={{marginBottom:20}}>
          <label style={{fontSize:13,color:'#94a3b8',display:'block',marginBottom:6}}>Toppscorer (6 poeng)</label>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
            {tsTipps.map(t => (
              <button key={t} onClick={()=>setTs(t)} className="btn" style={{
                fontSize:12, padding:'4px 12px',
                background: ts===t?'rgba(74,222,128,0.2)':C.w(0.06),
                border: ts===t?'1px solid #4ade80':`1px solid ${C.w(0.1)}`,
                color: ts===t?'#4ade80':'#94a3b8'
              }}>
                {t}
              </button>
            ))}
          </div>
          <input
            value={ts}
            onChange={e=>setTs(e.target.value)}
            placeholder="Eller skriv inn spiller..."
            style={{
              width:'100%',padding:'8px 12px',background:C.w(0.06),
              border:`1px solid ${C.w(0.15)}`,borderRadius:8,color:C.inputText,fontSize:14
            }}
          />
        </div>

        <button className="btn btn-primary" onClick={save} style={{width:'100%',padding:'12px'}}>
          {saved ? '✓ Lagret!' : 'Lagre bonuspoeng'}
        </button>
      </div>

      <div className="glass" style={{padding:20}}>
        <h3 style={{fontSize:15,fontWeight:700,marginBottom:12,color:'#a78bfa'}}>Alle bonustipps</h3>
        <table>
          <thead>
            <tr>
              <th>Deltaker</th>
              <th>VM-vinner tippet</th>
              <th>Toppscorer tippet</th>
            </tr>
          </thead>
          <tbody>
            {PARTICIPANTS.map(p => {
              const m = META[p] || {};
              const vmOk = meta.vm_winner && m.vinner_vm === meta.vm_winner;
              const tsOk = meta.toppscorer && m.toppscorer === meta.toppscorer;
              return (
                <tr key={p}>
                  <td style={{fontWeight:600}}>{p}</td>
                  <td>
                    <span style={{color:vmOk?'#4ade80':C.text}}>
                      <Flag country={m.vinner_vm}/> {m.vinner_vm||'–'}
                      {vmOk?<span style={{marginLeft:6,fontSize:11,color:'#4ade80'}}>+5 ✓</span>:''}
                    </span>
                  </td>
                  <td>
                    <span style={{color:tsOk?'#4ade80':C.text}}>
                      {m.toppscorer||'–'}
                      {tsOk?<span style={{marginLeft:6,fontSize:11,color:'#4ade80'}}>+6 ✓</span>:''}
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ===== MAIN APP =====
function App() {
  const { mode: themeMode, setMode: setThemeMode, isDark } = useTheme();
  const [tab, setTab] = useState('tabell');
  const [results, setResults] = useState({});
  const [liveMatches, setLiveMatches] = useState([]);
  const [meta, setMeta] = useState(() => loadMeta());
  const [apiStatus, setApiStatus] = useState('loading'); // loading | ok | error
  const [lastUpdated, setLastUpdated] = useState(null);
  const [cacheAge, setCacheAge] = useState(null);

  useEffect(() => { saveMeta(meta); }, [meta]);

  const fetchResults = () => {
    fetch('/api/results')
      .then(r => r.json())
      .then(data => {
        // Convert string keys to numbers for consistency
        const mapped = {};
        Object.entries(data.results || {}).forEach(([k, v]) => { mapped[parseInt(k)] = v; });
        setResults(mapped);
        setLiveMatches(data.live || []);
        setCacheAge(data.cache_age_seconds);
        setLastUpdated(new Date());
        setApiStatus('ok');
      })
      .catch(() => setApiStatus('error'));
  };

  useEffect(() => {
    fetchResults();
    const interval = setInterval(fetchResults, 30000); // refresh every 30s
    return () => clearInterval(interval);
  }, []);

  const playedCount = Object.values(results).filter(r => r.home_score !== null && r.home_score !== undefined).length;
  const hasLive = liveMatches.length > 0;

  const tabs = [
    { id:'tabell', label:'🏆 Tabell' },
    { id:'kamper', label:'⚽ Kamper' },
    { id:'deltakere', label:'👤 Deltakere' },
    { id:'statistikk', label:'📊 Statistikk' },
    { id:'admin', label:'⚙️ Bonuspoeng' },
  ];

  return (
    <ThemeCtx.Provider value={{isDark}}>
    <div style={{minHeight:'100vh'}}>
      {/* Header */}
      <div style={{
        background: isDark
          ? 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%)'
          : 'linear-gradient(135deg, #1e3a5f 0%, #312e81 50%, #1e3a5f 100%)',
        borderBottom:'1px solid var(--border)',
        padding:'0 16px'
      }}>
        <div style={{maxWidth:1100,margin:'0 auto'}}>
          <div style={{padding:'20px 0 0',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
            <div>
              <h1 style={{fontSize:28,fontWeight:900,lineHeight:1}}>
                <span className="gradient-text">Lotteria VM 2026</span>
              </h1>
              <div style={{fontSize:13,color:'#64748b',marginTop:4}}>
                {playedCount}/72 kamper • {PARTICIPANTS.length} deltakere • Pott: 20 000 kr
              </div>
            </div>
            <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
              {hasLive && (
                <span style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'#f87171',fontWeight:600}}>
                  <span className="live-dot"></span>
                  {liveMatches.length} kamp{liveMatches.length > 1 ? 'er' : ''} live
                </span>
              )}
              <span style={{fontSize:11,color:'#475569',display:'flex',alignItems:'center',gap:6}}>
                {apiStatus === 'loading' && '⏳ Henter...'}
                {apiStatus === 'error' && <span style={{color:'#f87171'}}>⚠️ Kan ikke hente data</span>}
                {apiStatus === 'ok' && lastUpdated && (
                  <>
                    <span style={{color:'#22c55e'}}>●</span>
                    Oppdatert {lastUpdated.toLocaleTimeString('no')}
                  </>
                )}
              </span>
              <button onClick={fetchResults} style={{
                background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',
                borderRadius:6,color:'#94a3b8',padding:'4px 10px',cursor:'pointer',fontSize:12
              }}>↻ Oppdater</button>
              <div className="theme-toggle">
                <button className={`theme-btn${themeMode==='light'?' active':''}`} onClick={()=>setThemeMode('light')} title="Lys modus">☀️</button>
                <button className={`theme-btn${themeMode==='dark'?' active':''}`} onClick={()=>setThemeMode('dark')} title="Mørk modus">🌙</button>
                <button className={`theme-btn${themeMode==='system'?' active':''}`} onClick={()=>setThemeMode('system')} title="Systeminnstilling">💻</button>
              </div>
            </div>
          </div>

          {/* Live match ticker */}
          {hasLive && (
            <div style={{
              display:'flex',gap:12,overflowX:'auto',padding:'10px 0 4px',
              scrollbarWidth:'none'
            }}>
              {liveMatches.map(m => (
                <div key={m.match_num} style={{
                  background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',
                  borderRadius:8,padding:'6px 14px',whiteSpace:'nowrap',fontSize:13,flexShrink:0
                }}>
                  <span style={{color:'#f87171',fontWeight:700,marginRight:6}}>{m.clock}</span>
                  <span>{FLAGS[m.home]||''} {m.home}</span>
                  <span style={{fontWeight:800,margin:'0 8px',color:'white'}}>{m.home_score}–{m.away_score}</span>
                  <span>{m.away} {FLAGS[m.away]||''}</span>
                </div>
              ))}
            </div>
          )}

          <div style={{display:'flex',gap:0,marginTop:hasLive?4:12,overflowX:'auto'}}>
            {tabs.map(t => (
              <button key={t.id} className={`nav-tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:1100,margin:'0 auto',padding:'24px 16px'}}>
        {tab==='tabell' && <TabelView results={results} meta={meta}/>}
        {tab==='kamper' && <KamperView results={results}/>}
        {tab==='deltakere' && <DeltakerView results={results} meta={meta}/>}
        {tab==='statistikk' && <StatistikkView results={results} meta={meta}/>}
        {tab==='admin' && <AdminView meta={meta} setMeta={setMeta}/>}
      </div>
    </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
